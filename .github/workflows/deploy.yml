# Deploys Tally to Firebase Hosting + Firestore rules.
# MANUAL ONLY: it runs when you open the Actions tab, pick "Deploy to Firebase",
# press "Run workflow" and type `deploy`. It never runs on push.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   ENV_LOCAL                 – the full contents of your .env.local
#   FIREBASE_SERVICE_ACCOUNT  – a Google Cloud service-account key (JSON)
# See scripts/setup.md → "Deploy from your phone (GitHub)".
name: Deploy to Firebase

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write .env.local from the ENV_LOCAL secret
        env:
          ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
        run: |
          if [ -z "$ENV_LOCAL" ]; then echo "::error::Missing ENV_LOCAL secret"; exit 1; fi
          printf '%s\n' "$ENV_LOCAL" > .env.local

      - name: Check (lint + unit tests)
        run: |
          npm run lint
          npm test

      - name: Build (generates firestore.rules, then the app)
        run: |
          npm run rules
          npm run build

      - name: Deploy hosting + Firestore rules
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then echo "::error::Missing FIREBASE_SERVICE_ACCOUNT secret"; exit 1; fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15 deploy --only hosting,firestore:rules --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
